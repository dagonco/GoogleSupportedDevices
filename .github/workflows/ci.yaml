name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    # Weekly run to detect changes in the format of Google's CSV.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'jetbrains'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit Test
        run: ./gradlew :gsd:testDebugUnitTest
        env:
          GSD_LIVE_CSV: 'true'

      - name: Lint
        run: ./gradlew :gsd:lintDebug

      - name: Build
        run: ./gradlew :gsd:assembleRelease :app:assembleDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: '**/build/reports/'
